<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BodyTrain • Mode hors-ligne</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #FAF8F5;
        color: #1D2D24;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
        box-sizing: border-box;
      }
      .card {
        background: #FFFFFF;
        border-radius: 20px;
        padding: 30px 24px;
        text-align: center;
        max-width: 400px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      }
      h1 { font-size: 1.3rem; margin-bottom: 8px; color: #2D6A4F; }
      p { font-size: 0.95rem; color: #5C6F64; line-height: 1.45; }
      button {
        margin-top: 16px;
        padding: 12px 20px;
        background: #2D6A4F;
        color: #fff;
        border: none;
        border-radius: 12px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>BodyTrain fonctionne hors-ligne</h1>
      <p>L’application est prête et accessible sans connexion internet. Tes séances restent disponibles.</p>
      <button onclick="window.location.href='/'">Accéder à ma séance</button>
    </div>
  </body>
</html>
